<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مساعد التجويد</title>

  <!-- Arabic Fonts: Tajawal for clean UI & Amiri for Quranic/Poetic quotes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Markdown Parser & HTML Sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <style>
    :root {
      --bg-page: #f5f4f0;
      --bg-surface: #ffffff;
      --primary: #0f5c3a;
      --primary-dark: #0a4229;
      --primary-light: #e8f3ee;
      --accent-gold: #c6972c;
      --accent-gold-bg: #fcf8ee;
      --text-main: #1e2421;
      --text-muted: #5c6862;
      --border-subtle: #e2e5e1;
      --shadow-sm: 0 2px 8px rgba(15, 92, 58, 0.06);
      --shadow-md: 0 6px 24px rgba(15, 92, 58, 0.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      direction: rtl;
    }

    /* App Shell */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      background: var(--bg-surface);
      box-shadow: var(--shadow-md);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #ffffff;
      border-bottom: 3px solid var(--accent-gold);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Amiri', serif;
      font-size: 22px;
      color: #f6d365;
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .brand-text p {
      font-size: 0.82rem;
      opacity: 0.85;
    }

    .clear-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* Messages Area */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background-image: radial-gradient(#dce3de 0.75px, transparent 0.75px);
      background-size: 20px 20px;
      background-color: #faf9f6;
    }

    /* Welcome Empty State */
    .welcome-card {
      margin: auto;
      text-align: center;
      max-width: 540px;
      background: var(--bg-surface);
      padding: 32px 24px;
      border-radius: 18px;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }

    .welcome-card h2 {
      color: var(--primary);
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .welcome-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .suggestion-chip {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid rgba(15, 92, 58, 0.18);
      padding: 8px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-chip:hover {
      background: var(--primary);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Message Rows & Bubbles (Proper RTL Alignment) */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      animation: fadeIn 0.22s ease-out;
    }

    /* In RTL, flex-start is on the RIGHT */
    .msg-row.user {
      align-self: flex-start;
    }

    /* In RTL, flex-end is on the LEFT */
    .msg-row.assistant {
      align-self: flex-end;
      width: 100%;
    }

    .msg-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .msg-bubble {
      padding: 14px 18px;
      font-size: 1.02rem;
      /* Extra line-height prevents Arabic diacritics (Tashkeel) from overlapping */
      line-height: 1.95;
      word-wrap: break-word;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #ffffff;
      border-radius: 18px 18px 4px 18px;
      box-shadow: var(--shadow-sm);
    }

    .msg-row.assistant .msg-bubble {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 18px 18px 18px 4px;
      box-shadow: var(--shadow-sm);
    }

    /* Markdown Typography Inside Assistant Messages */
    .markdown-body > *:first-child { margin-top: 0; }
    .markdown-body > *:last-child { margin-bottom: 0; }

    .markdown-body p {
      margin-bottom: 12px;
    }

    .markdown-body strong {
      color: var(--primary-dark);
      font-weight: 700;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: var(--primary);
      margin: 16px 0 8px;
      font-weight: 800;
      line-height: 1.5;
    }

    .markdown-body ul, .markdown-body ol {
      margin: 8px 0 14px;
      padding-right: 22px;
      padding-left: 0;
    }

    .markdown-body li {
      margin-bottom: 6px;
    }

    .markdown-body blockquote {
      margin: 12px 0;
      padding: 10px 16px;
      background: var(--accent-gold-bg);
      border-right: 4px solid var(--accent-gold);
      border-left: none;
      border-radius: 8px 0 0 8px;
      font-family: 'Amiri', serif;
      font-size: 1.2rem;
      color: #3d3110;
    }

    .markdown-body code {
      background: #f0f2f0;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.92em;
      color: var(--primary-dark);
    }

    .markdown-body pre {
      background: #1e2421;
      color: #f8f9fa;
      padding: 12px 14px;
      border-radius: 8px;
      overflow-x: auto;
      direction: ltr;
      text-align: left;
      margin: 10px 0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.95rem;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      text-align: right;
    }

    .markdown-body th {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    /* Copy Button */
    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    /* Typing Indicator */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 2px;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.4;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input Footer */
    .input-footer {
      padding: 14px 20px 18px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    #input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #f8f9f8;
      border: 1.5px solid #cfd6d2;
      border-radius: 14px;
      padding: 8px 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #input-area:focus-within {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(15, 92, 58, 0.12);
    }

    #user-input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-main);
      resize: none;
      max-height: 140px;
      padding: 4px;
      outline: none;
    }

    #send-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    #send-btn:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    #send-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    #send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .helper-hint {
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      #messages { padding: 16px; }
      .msg-row { max-width: 94%; }
      .brand-text p { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">ض</div>
        <div class="brand-text">
          <h1>مساعد التجويد</h1>
          <p>اسأل عن أحكام التلاوة، مخارج الحروف، وصفاتها</p>
        </div>
      </div>
      <button class="clear-btn" onclick="clearChat()" title="بدء محادثة جديدة">محادثة جديدة</button>
    </header>

    <div id="messages">
      <div class="welcome-card" id="welcome-card">
        <h2>أهلاً بك في مساعد التجويد</h2>
        <p>يمكنك طرح أي سؤال حول أحكام النون الساكنة والتنوين، المدود، القلقلة، مخارج الحروف، أو الاستشهاد بأبيات الجزرية.</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="useSuggestion('ما هي القلقلة وما حروفها؟')">ما هي القلقلة وما حروفها؟</button>
          <button class="suggestion-chip" onclick="useSuggestion('ما الفرق بين الإظهار الحلقي والإدغام؟')">الفرق بين الإظهار والإدغام</button>
          <button class="suggestion-chip" onclick="useSuggestion('اذكر أقسام المد الفرعي باختصار')">أقسام المد الفرعي</button>
          <button class="suggestion-chip" onclick="useSuggestion('ما هي حروف الاستعلاء؟')">حروف الاستعلاء</button>
        </div>
      </div>
    </div>

    <div class="input-footer">
      <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="اكتب سؤالك في علم التجويد هنا..." autofocus></textarea>
        <button id="send-btn" onclick="sendMessage()">
          <span>إرسال</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="helper-hint">اضغط Enter للإرسال، و Shift + Enter لسطر جديد</div>
    </div>
  </div>

  <script>
    const API_URL = "https://e0db8796-6c00-433a-8e7d-383cc61847a7.search.ai.cloudflare.com/chat/completions";
    let conversationHistory = [];
    let isStreaming = false;

    const messagesContainer = document.getElementById("messages");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    // Configure Marked for clean line breaks & GFM
    if (window.marked) {
      marked.setOptions({
        breaks: true,
        gfm: true
      });
    }

    function renderMarkdown(rawText) {
      if (!rawText) return "";
      if (window.marked && window.DOMPurify) {
        const parsedHtml = marked.parse(rawText);
        return DOMPurify.sanitize(parsedHtml);
      }
      // Lightweight fallback if offline
      return rawText
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/^&gt;\s?(.*)$/gm, "<blockquote>$1</blockquote>")
        .replace(/\n/g, "<br>");
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function useSuggestion(text) {
      userInput.value = text;
      sendMessage();
    }

    function clearChat() {
      if (isStreaming) return;
      conversationHistory = [];
      messagesContainer.innerHTML = `
        <div class="welcome-card" id="welcome-card">
          <h2>أهلاً بك في مساعد التجويد</h2>
          <p>يمكنك طرح أي سؤال حول أحكام النون الساكنة والتنوين، المدود، القلقلة، مخارج الحروف، أو الاستشهاد بأبيات الجزرية.</p>
          <div class="suggestions">
            <button class="suggestion-chip" onclick="useSuggestion('ما هي القلقلة وما حروفها؟')">ما هي القلقلة وما حروفها؟</button>
            <button class="suggestion-chip" onclick="useSuggestion('ما الفرق بين الإظهار الحلقي والإدغام؟')">الفرق بين الإظهار والإدغام</button>
            <button class="suggestion-chip" onclick="useSuggestion('اذكر أقسام المد الفرعي باختصار')">أقسام المد الفرعي</button>
            <button class="suggestion-chip" onclick="useSuggestion('ما هي حروف الاستعلاء؟')">حروف الاستعلاء</button>
          </div>
        </div>
      `;
      userInput.focus();
    }

    function addMessage(text, role) {
      const welcomeCard = document.getElementById("welcome-card");
      if (welcomeCard) welcomeCard.remove();

      const row = document.createElement("div");
      row.className = `msg-row ${role}`;

      const meta = document.createElement("div");
      meta.className = "msg-meta";
      meta.innerHTML = `<span>${role === "user" ? "أنت" : "مساعد التجويد"}</span>`;

      const bubble = document.createElement("div");
      bubble.className = role === "assistant" ? "msg-bubble markdown-body" : "msg-bubble";

      if (role === "user") {
        bubble.textContent = text;
      } else {
        bubble.innerHTML = `
          <div class="typing-dots" aria-label="جاري الكتابة">
            <span></span><span></span><span></span>
          </div>
        `;
      }

      row.appendChild(meta);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);
      scrollToBottom();

      return { row, meta, bubble };
    }

    function attachCopyButton(metaEl, getRawText) {
      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "نسخ الإجابة";
      btn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(getRawText());
          btn.textContent = "تم النسخ ✓";
          setTimeout(() => (btn.textContent = "نسخ الإجابة"), 1800);
        } catch {
          btn.textContent = "تعذّر النسخ";
        }
      };
      metaEl.appendChild(btn);
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;

      // Add user message
      addMessage(text, "user");
      conversationHistory.push({ role: "user", content: text });

      userInput.value = "";
      userInput.style.height = "auto";

      // Create assistant message bubble
      const assistantMsg = addMessage("", "assistant");
      let fullText = "";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: conversationHistory,
            stream: true
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let sseBuffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // Keep partial lines buffered across chunks so JSON.parse never breaks
          sseBuffer += decoder.decode(value, { stream: true });
          const lines = sseBuffer.split("\n");
          sseBuffer = lines.pop();

          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line || !line.startsWith("data:")) continue;

            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;

            try {
              const data = JSON.parse(payload);
              const delta = data.choices?.[0]?.delta?.content;
              if (delta) {
                fullText += delta;
                assistantMsg.bubble.innerHTML = renderMarkdown(fullText);
                scrollToBottom();
              }
            } catch (parseErr) {
              // Ignore malformed keep-alive comments if any
            }
          }
        }

        // Final render pass
        if (fullText) {
          assistantMsg.bubble.innerHTML = renderMarkdown(fullText);
          conversationHistory.push({ role: "assistant", content: fullText });
          attachCopyButton(assistantMsg.meta, () => fullText);
        } else {
          assistantMsg.bubble.textContent = "لم يتم استلام رد. حاول مرة أخرى.";
        }
      } catch (err) {
        assistantMsg.bubble.textContent = "حدث خطأ أثناء الاتصال بالخادم. يرجى المحاولة مرة أخرى.";
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
        userInput.focus();
        scrollToBottom();
      }
    }

    // Auto-resize textarea height
    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 140) + "px";
    });

    // Send on Enter, new line on Shift+Enter
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
